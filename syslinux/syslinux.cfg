SERIAL 0 38400
DEFAULT vesamenu.c32
PROMPT 0
TIMEOUT 150
ONTIMEOUT omunchy

# VESA menu background + matching resolution (splash.png lives next to this cfg)
MENU BACKGROUND splash.png
MENU RESOLUTION 1024 768

# Geometry for a 128x48 character grid (1024x768)
MENU WIDTH 128
MENU MARGIN 34
MENU ROWS 7
MENU VSHIFT 13
MENU TIMEOUTROW 40
MENU TABMSGROW 40
MENU CMDLINEROW 39
MENU HELPMSGROW 42
MENU HELPMSGENDROW 47

# Refer to http://www.syslinux.org/wiki/index.php/Doc/menu
# Color format is #AARRGGBB - alpha first! Green accent: #5fd068
MENU COLOR border       30;44     #00000000 #00000000 std
MENU COLOR title        1;36;40   #f45fd068 #00000000 std
MENU COLOR sel          7;37;40   #f0000000 #f85fd068 all
MENU COLOR hotsel       1;7;37;40 #f0000000 #f85fd068 all
MENU COLOR unsel        37;44     #e8ebe4dc #30000000 std
MENU COLOR hotkey       1;37;44   #e05fd068 #30000000 std
MENU COLOR help         37;40     #98cfc9b8 #20000000 std
MENU COLOR timeout_msg  37;40     #b0ebe6da #00000000 std
MENU COLOR timeout      1;37;40   #f85fd068 #00000000 std
MENU COLOR msg07        37;40     #a8d8d4c8 #20000000 std
MENU COLOR tabmsg       31;40     #c85fd068 #20000000 std

LABEL omunchy
TEXT HELP
Omunchy - MangoWC Wayland compositor
ENDTEXT
MENU LABEL MangoWC (Wayland)
LINUX /arch/boot/x86_64/vmlinuz-linux
INITRD /arch/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G

LABEL existing
TEXT HELP
Boot an existing operating system.
Press TAB to edit the disk and partition number to boot.
ENDTEXT
MENU LABEL Boot existing OS
COM32 chain.c32
APPEND hd0 0

# http://www.memtest.org/
LABEL memtest
MENU LABEL Run Memtest86+ (RAM test)
LINUX /boot/memtest86+/memtest

# http://hdt-project.org/
LABEL hdt
MENU LABEL Hardware Information (HDT)
COM32 hdt.c32
APPEND modules_alias=hdt/modalias.gz pciids=hdt/pciids.gz

LABEL reboot
MENU LABEL Reboot
COM32 reboot.c32

LABEL poweroff
MENU LABEL Power Off
COM32 poweroff.c32