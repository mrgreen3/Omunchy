# TUI app definitions for omunchy
# Format: Name|Command|Style|Icon
#   Command  what xdg-terminal-exec runs, e.g. `htop`
#   Style    window style exposed via the app-id for sway window rules:
#            float or tile (optional, defaults to float)
#   Icon     optional — themed icon name, a file path, or a URL; falls back to
#            a generic terminal icon if omitted.
# Legacy 3-field lines (Name|Command|Icon) are still accepted (style = float).

dgop|dgop top|float|utilities-system-monitor
