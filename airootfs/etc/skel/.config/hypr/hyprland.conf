# =============================================================================
# Omunchy — Hyprland configuration (plain conf, no Lua).
#
# Omarchy-parity bindings on the waybar/foot/mako/rofi stack. Reload after
# editing: omunchy hypr reload   (or: hyprctl reload)
# =============================================================================

# -----------------------------------------------------------------------------
# MONITOR
# -----------------------------------------------------------------------------
monitor=,preferred,auto,1

# -----------------------------------------------------------------------------
# ENVIRONMENT + PORTALS
# -----------------------------------------------------------------------------
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = MOZ_ENABLE_WAYLAND,1
env = GDK_BACKEND,wayland,x11
# Privilege-escalation prompts (in packages.x86_64; Hyprland ships no polkit agent)
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Re-export the session into the user bus so xdg-desktop-portal-hyprland picks
# up the screencast/screenshot portals (Hyprland portal setup)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP

# -----------------------------------------------------------------------------
# AUTOSTART
# -----------------------------------------------------------------------------
exec-once = waybar
exec-once = mako

# Wallpaper — the second exec-once line is rewritten by `omunchy bg-set <image>`
exec-once = hyprpaper
exec-once = sleep 1 && hyprctl hyprpaper preload ~/Backgrounds/aesthetic.jpg && hyprctl hyprpaper wallpaper ,~/Backgrounds/aesthetic.jpg

# -----------------------------------------------------------------------------
# LOOK & FEEL (translated from Omarchy default/hypr/looknfeel.lua)
# -----------------------------------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

group {
    groupbar {
        font_size = 12
        font_family = monospace
        gradients = true
    }
}

# Border / group colours are swapped by `omunchy theme-set <name>`
source = ~/.config/hypr/theme.conf

animations {
    enabled = yes

    bezier = easeOutQuint, 0.23, 1.0, 0.32, 1.0
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1.0
    bezier = linear, 0.0, 0.0, 1.0, 1.0
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    bezier = quick, 0.15, 0.0, 0.1, 1.0

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 3.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = fadeSwitch, 0
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 0
}

dwindle {
    preserve_split = yes
    force_split = 2
}

misc {
    disable_hyprland_logo = yes
    disable_splash_rendering = yes
    disable_scale_notification = yes
    focus_on_activate = yes
    anr_missed_pings = 3
    on_focus_under_fullscreen = 1
    initial_workspace_tracking = 0
    allow_session_lock_restore = yes
}

cursor {
    hide_on_key_press = yes
    warp_on_change_workspace = 1
}

binds {
    hide_special_on_workspace_change = yes
}

# -----------------------------------------------------------------------------
# INPUT
# -----------------------------------------------------------------------------
input {
    kb_layout = us
    repeat_rate = 25
    repeat_delay = 600
    numlock_by_default = no

    touchpad {
        tap-to-click = yes
        natural_scroll = no
        disable_while_typing = yes
    }
}

gestures {
    workspace_swipe = yes
    workspace_swipe_fingers = 3
}

# -----------------------------------------------------------------------------
# WINDOW RULES (omunchy launchers — see config/tuis.conf)
# -----------------------------------------------------------------------------
windowrule = float, class:^(omunchy\.TUI\.float)$
windowrule = float, class:^(omunchy\.Installer)$

# -----------------------------------------------------------------------------
# KEYBINDS
# -----------------------------------------------------------------------------
$terminal = foot

# --- Apps ---
bind = SUPER, Return, exec, $terminal
bind = SUPER, SPACE, exec, rofi -show drun
bind = SUPER, B, exec, firefox
bind = SUPER, E, exec, thunar
bind = SUPER, S, exec, foot -e dgop top
bind = SUPER, K, exec, bash -c 'grep -E "(Super|Ctrl|Vol|Mute|Bright)" ~/Documents/Keybindings | rofi -dmenu -p Keybinds -theme-str "listview { lines: 18; columns: 2; }"'

# --- Windows ---
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen, 0
bind = SUPER, T, togglefloating
bind = SUPER, V, togglesplit

# --- Focus & movement ---
bind = SUPER, LEFT, movefocus, l
bind = SUPER, RIGHT, movefocus, r
bind = SUPER, UP, movefocus, u
bind = SUPER, DOWN, movefocus, d
bind = SUPER SHIFT, LEFT, movewindow, l
bind = SUPER SHIFT, RIGHT, movewindow, r
bind = SUPER SHIFT, UP, movewindow, u
bind = SUPER SHIFT, DOWN, movewindow, d
bind = SUPER, TAB, workspace, e+1
bind = SUPER SHIFT, TAB, workspace, e-1

# --- Workspaces ---
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# --- Monitors ---
bind = SUPER ALT, LEFT, focusmonitor, l
bind = SUPER ALT, RIGHT, focusmonitor, r

# --- Audio & brightness ---
binde = , XF86AudioRaiseVolume, exec, pamixer -i 5
binde = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t

binde = , XF86MonBrightnessUp, exec, brightnessctl s +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# --- Session ---
bind = SUPER, P, exec, ~/Scripts/screenshot
bind = SUPER SHIFT, S, exec, ~/Scripts/screenshot -r
bind = SUPER, L, exec, hyprlock
bind = SUPER, R, exec, hyprctl reload
bind = SUPER SHIFT, E, exec, ~/Scripts/powermenu