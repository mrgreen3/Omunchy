# Omunchy — mango configuration. Reload: Super+R

# AUTOSTART
exec-once=systemctl --user set-environment XDG_CURRENT_DESKTOP=mango XDG_SESSION_TYPE=wayland XDG_SESSION_DESKTOP=mango
exec-once=systemctl --user import-environment WAYLAND_DISPLAY
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=mango
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once=waybar
exec-once=mako
exec-once=udiskie
exec-once=swaybg -i "$HOME/Backgrounds/mountain-moon.jpg" -m fill
exec-once=swayidle -w timeout 300 'omunchy-lock' before-sleep 'omunchy-lock'
exec-once=~/Scripts/omunchy-welcome

# APPEARANCE
borderpx=2
border_radius=0
rootcolor=0x000000ff
bordercolor=0x414942ff
focuscolor=0x93d5aaff
urgentcolor=0xffb4abff
blur=0
shadows=0
animations=0
gappih=3
gappiv=3
gappoh=3
gappov=3

# LAYOUT
tag_num=5
tagrule=id:1,layout_name:dwindle
tagrule=id:2,layout_name:dwindle
tagrule=id:3,layout_name:dwindle
tagrule=id:4,layout_name:dwindle
tagrule=id:5,layout_name:dwindle

# KEYBOARD
xkb_rules_layout=us
repeat_rate=25
repeat_delay=600
numlockon=0

# TRACKPAD
tap_to_click=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1

# MISC
sloppyfocus=1
cursor_size=24
cursor_theme=Adwaita

# KEY BINDINGS
# --- Apps ---
bind=SUPER,Return,spawn,foot
bind=SUPER,space,spawn,rofi -show drun
bind=SUPER,w,spawn,firefox
bind=SUPER,f,spawn,foot -e spf
bind=SUPER,s,spawn,foot -e dgop top
bind=SUPER,k,spawn,sh -c "grep -E '(Super|Ctrl|Vol|Mute|Bright)' ~/Documents/Keybindings | rofi -dmenu -p Keybinds -theme-str 'window { width: 90%; } listview { lines: 18; columns: 3; }'"
# Live ISO only: obinstall launcher (Super+i); removed from installed systems
bind=SUPER,i,spawn,~/Scripts/obinstall

# --- Windows ---
bind=SUPER,q,killclient,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=SUPER,t,togglefloating,
bind=SUPER+SHIFT,t,toggle_all_floating
bind=SUPER,v,dwindle_toggle_split_direction

# --- Focus & movement ---
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER,Tab,viewtoright,0
bind=SUPER+SHIFT,Tab,viewtoleft,0

# --- Workspaces (tags) 1-5 ---
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0

# --- Monitors ---
bind=SUPER+Alt,Left,focusmon,left
bind=SUPER+Alt,Right,focusmon,right

# --- Audio & brightness ---
bind=NONE,XF86AudioRaiseVolume,spawn,pamixer -i 5
bind=NONE,XF86AudioLowerVolume,spawn,pamixer -d 5
bind=NONE,XF86AudioMute,spawn,pamixer -t
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 5%-

# --- Session ---
bind=SUPER,p,spawn,~/Scripts/screenshot
bind=SUPER+SHIFT,s,spawn,~/Scripts/screenshot -r
bind=SUPER,l,spawn,~/Scripts/omunchy-lock
bind=SUPER,r,reload_config
bind=SUPER+SHIFT,e,spawn,~/Scripts/powermenu

# MOUSE BINDINGS
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# WINDOW RULES
# obinstall (live only): float the setup window at 80% of the screen
windowrule=isfloating:1,width:0.8,height:0.8,appid:^omunchy\.Installer$
