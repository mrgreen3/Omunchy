# Omunchy — mango configuration. Reload: Super+R

# AUTOSTART
exec_once=systemctl --user set-environment XDG_CURRENT_DESKTOP=mango XDG_SESSION_TYPE=wayland XDG_SESSION_DESKTOP=mango
exec_once=systemctl --user import-environment WAYLAND_DISPLAY
exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=mango
exec_once=waybar
exec_once=noctalia
exec_once=udiskie
exec_once=~/Scripts/omunchy-welcome

# APPEARANCE
border_px=2
border_radius=0
root_color=0x000000ff
border_color=0x414942ff
focus_color=0x93d5aaff
urgent_color=0xffb4abff
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.0
layer_animations=0
shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=4
shadows_blur=12
shadows_position_x=2
shadows_position_y=2
shadows_color=0x000000ff
animations=0
gap_inner_horizontal=3
gap_inner_vertical=3
gap_outer_horizontal=3
gap_outer_vertical=3

# LAYOUT
tag_num=5
tag_rule=id:1,layout_name:dwindle
tag_rule=id:2,layout_name:dwindle
tag_rule=id:3,layout_name:dwindle
tag_rule=id:4,layout_name:dwindle
tag_rule=id:5,layout_name:dwindle

# KEYBOARD
xkb_rules_layout=gb
repeat_rate=25
repeat_delay=600
numlock_on=0

# TRACKPAD
tap_to_click=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1

# MISC
sloppy_focus=1
cursor_size=24
cursor_theme=Adwaita

# KEY BINDINGS
# --- Apps ---
#: Terminal
bind=SUPER,Return,spawn,foot
#: Launch apps
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
#: Browser
bind=SUPER,w,spawn,firefox
#: File manager
bind=SUPER,f,spawn,foot -e spf
#: System monitor
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center system
#: Control centre
bind=SUPER,c,spawn,noctalia msg panel-toggle control-center
#: Noctalia settings
bind=SUPER,comma,spawn,noctalia msg settings-toggle
#: Mango keybinds
bind=SUPER,k,spawn,~/Scripts/keybinds-menu
# Live ISO only: obinstall launcher (Super+i); removed from installed systems
#: Install Omunchy (obinstall)
bind=SUPER,i,spawn,~/Scripts/obinstall

# --- Windows ---
#: Close window
bind=SUPER,q,killclient,
#: Full screen
bind=SUPER+SHIFT,f,togglefullscreen,
#: Toggle window floating
bind=SUPER,t,togglefloating,
#: Toggle all windows floating
bind=SUPER+SHIFT,t,toggle_all_floating
#: Toggle split direction
bind=SUPER,v,dwindle_toggle_split_direction
#: Clipboard history
bind=SUPER+SHIFT,v,spawn,noctalia msg panel-toggle clipboard
#: Toggle Do Not Disturb
bind=SUPER+SHIFT,n,spawn,noctalia msg notification-dnd-toggle

# --- Focus & movement ---
#: Focus window left
bind=SUPER,Left,focusdir,left
#: Focus window right
bind=SUPER,Right,focusdir,right
#: Focus window up
bind=SUPER,Up,focusdir,up
#: Focus window down
bind=SUPER,Down,focusdir,down
#: Swap window left
bind=SUPER+SHIFT,Left,exchange_client,left
#: Swap window right
bind=SUPER+SHIFT,Right,exchange_client,right
#: Swap window up
bind=SUPER+SHIFT,Up,exchange_client,up
#: Swap window down
bind=SUPER+SHIFT,Down,exchange_client,down
#: Next workspace
bind=SUPER,Tab,viewtoright,0
#: Previous workspace
bind=SUPER+SHIFT,Tab,viewtoleft,0

# --- Workspaces (tags) 1-5 ---
#: Switch to workspace
bind=SUPER,1,view,1,0
#: Switch to workspace
bind=SUPER,2,view,2,0
#: Switch to workspace
bind=SUPER,3,view,3,0
#: Switch to workspace
bind=SUPER,4,view,4,0
#: Switch to workspace
bind=SUPER,5,view,5,0
#: Move window to workspace
bind=SUPER+SHIFT,1,tag,1,0
#: Move window to workspace
bind=SUPER+SHIFT,2,tag,2,0
#: Move window to workspace
bind=SUPER+SHIFT,3,tag,3,0
#: Move window to workspace
bind=SUPER+SHIFT,4,tag,4,0
#: Move window to workspace
bind=SUPER+SHIFT,5,tag,5,0

# --- Monitors ---
#: Focus left monitor
bind=SUPER+Alt,Left,focusmon,left
#: Focus right monitor
bind=SUPER+Alt,Right,focusmon,right

# --- Audio & brightness ---
#: Volume up
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
#: Volume down
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
#: Mute
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
#: Brightness up
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
#: Brightness down
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

# --- Session ---
#: Screenshot (full screen)
bind=SUPER,p,spawn,noctalia msg screenshot-fullscreen
#: Screenshot (region)
bind=SUPER+SHIFT,s,spawn,noctalia msg screenshot-region
#: Lock screen
bind=SUPER,l,spawn,noctalia msg session lock
#: Reload mango config
bind=SUPER,r,reload_config
#: Power menu
bind=SUPER+SHIFT,e,spawn,noctalia msg panel-toggle session

# MOUSE BINDINGS
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# WINDOW RULES
# obinstall (live only): float the setup window at 80% of the screen
window_rule=is_floating:1,width:0.8,height:0.8,app_id:^omunchy\.Installer$
# omunchy-askpass (sudo -A) password box
window_rule=is_floating:1,width:700,height:220,app_id:^omunchy-askpass
