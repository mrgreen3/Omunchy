# Omunchy: noctalia runs wallpaper, notifications, launcher, lock and panels; waybar is the bar.

[shell]
font_family  = "JetBrains Mono"
polkit_agent = true
clipboard_enabled = true
setup_wizard_enabled = false
corner_radius_scale  = 0.0

[shell.screenshot]
directory = "~/Pictures"

[notification]
enable_daemon = true

[wallpaper]
enabled   = true
fill_mode = "crop"
directory = "~/Backgrounds"

[wallpaper.default]
path = "~/Backgrounds/mountain-moon.jpg"

[nightlight]
enabled = false

[lockscreen]
enabled             = true
lock_before_suspend = true

[idle]
behavior_order = ["lock"]

[idle.behavior.lock]
timeout = 300
action  = "lock"
enabled = true

[bar]
order = ["main"]

[bar.main]
enabled        = false
shadow         = false
contact_shadow = false

[theme]
source           = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

[dock]
shadow = false

[shell.panel]
shadow  = false
borders = true

[shell.launcher]
categories = false
default_view = "all"
sort_by_usage = false
show_icons = true
compact    = true

[theme.templates.user.rofi]
input_path  = "~/.config/noctalia/templates/rofi-colors.rasi"
output_path = "~/.config/rofi/colors.rasi"

[theme.templates.user.mango]
input_path  = "~/.config/noctalia/templates/mango-colors.conf"
output_path = "~/.cache/omunchy-mango-colors.conf"
post_hook   = "~/.local/share/omunchy/bin/omunchy-theme-mango"

[theme.templates.user.waybar]
input_path  = "~/.config/noctalia/templates/waybar-colors.css"
output_path = "~/.config/waybar/colors.css"
post_hook   = "pkill -SIGUSR2 -x waybar"

[theme.templates.user.foot]
input_path  = "~/.config/noctalia/templates/foot"
output_path = "~/.config/foot/themes/noctalia"
