<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- No bold JetBrains Mono anywhere: any heavier weight is drawn as regular. -->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>JetBrains Mono</string></test>
    <test name="weight" compare="more"><const>regular</const></test>
    <edit name="weight" mode="assign"><const>regular</const></edit>
  </match>
</fontconfig>
