// Omunchy Firefox defaults: skip first-run, dark UI, dark web content, green accent.
defaultPref("browser.aboutwelcome.enabled", false);
defaultPref("browser.startup.homepage_override.mstone", "ignore");
defaultPref("browser.shell.checkDefaultBrowser", false);
defaultPref("browser.theme.toolbar-theme", 0);
defaultPref("browser.theme.content-theme", 0);
defaultPref("layout.css.prefers-color-scheme.content-override", 0);
defaultPref("ui.systemUsesDarkTheme", 1);
defaultPref("extensions.activeThemeID", "firefox-compact-dark@mozilla.org");

try {
  const { classes: Cc, interfaces: Ci } = Components;
  Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService).addObserver({
    observe() {
      const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
      const uri = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService)
        .newURI("file:///usr/lib/firefox/omunchy-chrome.css");
      if (!sss.sheetRegistered(uri, sss.USER_SHEET)) {
        sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
      }
    }
  }, "final-ui-startup");
} catch (e) { pref("omunchy.err", String(e)); }
